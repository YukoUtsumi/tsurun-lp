<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 460" width="220" height="460" role="img" aria-label="Tsurun ビューティーゼリー スティックパッケージ">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFBEA"/>
      <stop offset="0.55" stop-color="#F6EBB0"/>
      <stop offset="1" stop-color="#E4CD6E"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C7634"/>
      <stop offset="0.5" stop-color="#E3C27E"/>
      <stop offset="1" stop-color="#9C7634"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#8A7424" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#sh)">
    <!-- sachet body -->
    <path d="M30 28 H190 V432 Q190 440 182 440 H38 Q30 440 30 432 Z" fill="url(#body)"/>
    <!-- top seal -->
    <rect x="30" y="28" width="160" height="30" fill="url(#gold)" opacity="0.92"/>
    <g stroke="#fff" stroke-opacity="0.45" stroke-width="1.2">
      <line x1="30" y1="36" x2="190" y2="36"/><line x1="30" y1="42" x2="190" y2="42"/><line x1="30" y1="48" x2="190" y2="48"/>
    </g>
    <!-- bottom seal -->
    <rect x="30" y="414" width="160" height="26" fill="url(#gold)" opacity="0.85"/>
    <!-- sheen -->
    <rect x="52" y="64" width="34" height="344" fill="url(#shine)"/>
    <!-- label -->
    <g text-anchor="middle" font-family="'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif" fill="#4A3B38">
      <text x="110" y="132" font-size="38" font-weight="600" letter-spacing="3">Tsurun</text>
      <line x1="62" y1="150" x2="158" y2="150" stroke="#B8924A" stroke-width="1.4"/>
      <text x="110" y="176" font-size="13" letter-spacing="4" fill="#B8924A">BEAUTY JELLY</text>
      <text x="110" y="232" font-size="17" font-weight="600">ビューティー</text>
      <text x="110" y="256" font-size="17" font-weight="600">ゼリー</text>
      <text x="110" y="278" font-size="11" letter-spacing="2" fill="#8F7A12" font-weight="600">ゆずレモン味</text>
      <text x="110" y="298" font-size="10" fill="#6B5753">コラーゲンペプチド</text>
      <text x="110" y="312" font-size="10" fill="#6B5753">ヒアルロン酸・乳酸菌</text>
    </g>
    <!-- droplet motif -->
    <path d="M110 330 C 96 350, 90 362, 90 372 a20 20 0 0 0 40 0 C 130 362, 124 350, 110 330 Z" fill="#fff" fill-opacity="0.75" stroke="#B8924A" stroke-width="1"/>
    <path d="M102 372 a10 10 0 0 0 8 10" fill="none" stroke="#E4CD6E" stroke-width="2" stroke-linecap="round"/>
    <text x="110" y="408" text-anchor="middle" font-family="'Zen Kaku Gothic New','Hiragino Sans',sans-serif" font-size="9" fill="#6B5753">機能性表示食品 15g × 30本</text>
  </g>
</svg>
